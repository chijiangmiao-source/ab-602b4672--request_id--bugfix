<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星载指令包修订审查台</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:"SF Mono",Consolas,"Courier New",monospace; background:#0f1420; color:#dfe6f3; }
  header { padding:14px 22px; background:#141b2d; border-bottom:1px solid #26304a; display:flex; align-items:baseline; gap:14px; }
  header h1 { font-size:17px; margin:0; color:#8fd3ff; }
  header span { color:#6b7896; font-size:12px; }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:14px; padding:14px 22px; }
  section { background:#182034; border:1px solid #26304a; border-radius:8px; padding:14px 16px; }
  h2 { font-size:13px; margin:0 0 10px; color:#9db4d8; letter-spacing:1px; }
  label { display:block; font-size:11px; color:#7d8cab; margin:8px 0 3px; }
  input[type=text], textarea, select { width:100%; background:#0f1526; color:#dfe6f3; border:1px solid #2c3a5c; border-radius:5px; padding:6px 8px; font-family:inherit; font-size:12px; }
  textarea { min-height:110px; resize:vertical; white-space:pre; }
  button { margin-top:10px; background:#2b6cb0; border:none; color:#fff; padding:7px 16px; border-radius:5px; cursor:pointer; font-family:inherit; font-size:12px; }
  button:hover { background:#3182ce; }
  button.ghost { background:#2c3a5c; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  .result { margin-top:10px; font-size:12px; padding:8px 10px; border-radius:5px; white-space:pre-wrap; word-break:break-all; display:none; }
  .ok  { background:#12341f; border:1px solid #2f6b43; color:#9fe6b8; }
  .err { background:#3d1a1a; border:1px solid #7a3535; color:#f0a8a8; }
  table { width:100%; border-collapse:collapse; font-size:11px; margin-top:8px; }
  th, td { border:1px solid #2c3a5c; padding:4px 6px; text-align:left; vertical-align:top; }
  th { color:#8fa3c8; background:#141b2d; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; }
  .p-created,.p-applied { background:#1d4d2b; color:#9fe6b8; }
  .p-merged { background:#1d3a5f; color:#9cc8ff; }
  .p-rejected { background:#5f1d1d; color:#ffb3b3; }
  .p-replayed,.p-noop { background:#4a4a22; color:#e8e29a; }
  #doc { min-height:120px; max-height:260px; overflow:auto; background:#0f1526; border:1px solid #2c3a5c; border-radius:5px; padding:8px; font-size:11px; white-space:pre-wrap; word-break:break-all; }
  .kv { font-size:12px; margin:3px 0; }
  .kv b { color:#8fd3ff; font-weight:normal; }
  #pkglist button { margin:2px 4px 2px 0; padding:3px 10px; font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>星载指令包修订审查台</h1>
  <span>核心字段可编辑 · 扩展子树逐字节保留 · 陈旧修订按规范路径裁决</span>
</header>
<main>
  <div>
    <section>
      <h2>① 创建指令包（审查员 / 新终端）</h2>
      <div class="row">
        <div><label>请求标识 request_id</label><input type="text" id="c-rid"></div>
        <div><label>终端标识 terminal.id</label><input type="text" id="c-tid" value="reviewer-web"></div>
      </div>
      <label>终端已知字段 known_fields（逗号分隔）</label>
      <input type="text" id="c-known" value="name,satellite_id,priority,orbit,commands,valid_window,notes">
      <label>核心字段（JSON 对象）</label>
      <textarea id="c-core">{
  "name": "ORBIT-RAISE-07",
  "satellite_id": "SAT-19",
  "priority": "high",
  "orbit": {"altitude_km": 410, "inclination_deg": 51.6},
  "commands": [{"action": "burn", "params": {"dv_mps": 3.5}}],
  "valid_window": {"start": "2026-10-08T00:00:00Z", "end": "2026-10-09T00:00:00Z"}
}</textarea>
      <label>扩展字段（JSON 对象，原样逐字节保存）</label>
      <textarea id="c-ext">{
  "x_vendor_meta": { "seq": 1e3,  "band": "S", "tags": [ "legacy" , "night-pass" ] },
  "x_checksum": "0xBEEF"
}</textarea>
      <button onclick="createPkg()">创建指令包</button>
      <div class="result" id="c-res"></div>
    </section>

    <section style="margin-top:14px">
      <h2>② 提交局部修改（维护终端）</h2>
      <div class="row">
        <div><label>指令包 ID</label><input type="text" id="u-pid" placeholder="选择或填写"></div>
        <div><label>基于修订 base_revision</label><input type="text" id="u-base" placeholder="如 1"></div>
      </div>
      <div class="row">
        <div><label>请求标识 request_id</label><input type="text" id="u-rid"></div>
        <div><label>终端标识 terminal.id</label><input type="text" id="u-tid" value="legacy-terminal"></div>
      </div>
      <label>终端已知字段 known_fields（旧终端只声明子集）</label>
      <input type="text" id="u-known" value="name,priority,notes">
      <label>patch.set（JSON 对象：规范路径 → 新值）</label>
      <textarea id="u-set" style="min-height:60px">{"priority": "routine"}</textarea>
      <label>patch.delete（JSON 数组：待删规范路径）</label>
      <textarea id="u-del" style="min-height:40px">[]</textarea>
      <button onclick="submitPatch()">提交局部修改</button>
      <div class="result" id="u-res"></div>
    </section>
  </div>

  <div>
    <section>
      <h2>③ 指令包状态 <button class="ghost" style="margin:0 0 0 10px" onclick="refreshAll()">刷新</button></h2>
      <div id="pkglist"></div>
      <div id="pkgview" style="display:none">
        <div class="kv">当前修订：<b id="v-rev"></b></div>
        <div class="kv">规范摘要 (sha256)：<b id="v-sum"></b></div>
        <div class="kv">核心字段：<b id="v-core"></b></div>
        <div class="kv">被保留的扩展字段：<b id="v-ext"></b></div>
        <label>扩展子树原始字节</label>
        <div id="doc" style="min-height:40px;max-height:100px" ></div>
        <label>完整文档（新终端读取视图，含全部扩展内容）</label>
        <div id="docfull"></div>
        <label>历次裁决</label>
        <table>
          <thead><tr><th>#</th><th>时间 (UTC)</th><th>request_id</th><th>base</th><th>裁决</th><th>理由</th><th>结果修订</th></tr></thead>
          <tbody id="v-adj"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
<script>
let selected = null;
const $ = id => document.getElementById(id);
const newRid = p => p + "-" + Math.random().toString(16).slice(2, 10);
$("c-rid").value = newRid("create");
$("u-rid").value = newRid("patch");

function show(el, data, isErr) {
  el.className = "result " + (isErr ? "err" : "ok");
  el.style.display = "block";
  el.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
}

async function createPkg() {
  let core, ext;
  try { core = JSON.parse($("c-core").value); } catch (e) { return show($("c-res"), "核心字段 JSON 无效: " + e, true); }
  try { ext = JSON.parse($("c-ext").value); } catch (e) { return show($("c-res"), "扩展字段 JSON 无效: " + e, true); }
  const body = {
    request_id: $("c-rid").value.trim(),
    terminal: { id: $("c-tid").value.trim(), known_fields: $("c-known").value.split(",").map(s => s.trim()).filter(Boolean) },
    document: Object.assign({}, core, ext)
  };
  const r = await fetch("/api/packages", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  const j = await r.json();
  show($("c-res"), j, !r.ok);
  if (r.ok) { $("u-pid").value = j.package_id; $("u-base").value = j.revision; $("c-rid").value = newRid("create"); refreshAll(j.package_id); }
}

async function submitPatch() {
  let set, del;
  try { set = JSON.parse($("u-set").value || "{}"); } catch (e) { return show($("u-res"), "patch.set JSON 无效: " + e, true); }
  try { del = JSON.parse($("u-del").value || "[]"); } catch (e) { return show($("u-res"), "patch.delete JSON 无效: " + e, true); }
  const pid = $("u-pid").value.trim();
  const body = {
    request_id: $("u-rid").value.trim(),
    base_revision: parseInt($("u-base").value, 10),
    terminal: { id: $("u-tid").value.trim(), known_fields: $("u-known").value.split(",").map(s => s.trim()).filter(Boolean) },
    patch: { set, delete: del }
  };
  const r = await fetch("/api/packages/" + pid + "/revisions", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  const j = await r.json();
  show($("u-res"), j, !r.ok);
  if (r.ok) { $("u-rid").value = newRid("patch"); $("u-base").value = j.revision; refreshAll(pid); }
  else refreshAll(pid);
}

async function refreshAll(selectPid) {
  const r = await fetch("/api/packages");
  const j = await r.json();
  const list = $("pkglist");
  list.innerHTML = "";
  (j.packages || []).forEach(p => {
    const b = document.createElement("button");
    b.className = "ghost";
    b.textContent = p.id + " (rev " + p.current_revision + ")";
    b.onclick = () => loadPkg(p.id);
    list.appendChild(b);
  });
  if (selectPid) loadPkg(selectPid);
  else if (selected) loadPkg(selected);
}

async function loadPkg(pid) {
  selected = pid;
  const [meta, adj, doc] = await Promise.all([
    fetch("/api/packages/" + pid + "/meta").then(r => r.json()),
    fetch("/api/packages/" + pid + "/adjudications").then(r => r.json()),
    fetch("/api/packages/" + pid).then(r => r.text())
  ]);
  $("pkgview").style.display = "block";
  $("v-rev").textContent = meta.current_revision;
  $("v-sum").textContent = meta.summary;
  $("v-core").textContent = (meta.core_fields || []).join(", ") || "(无)";
  $("v-ext").textContent = (meta.extension_fields || []).join(", ") || "(无)";
  $("doc").textContent = meta.extensions_raw ? "{" + meta.extensions_raw + "}" : "{}";
  try { $("docfull").textContent = JSON.stringify(JSON.parse(doc), null, 2); }
  catch (e) { $("docfull").textContent = doc; }
  const tb = $("v-adj");
  tb.innerHTML = "";
  (adj.adjudications || []).forEach(a => {
    const tr = document.createElement("tr");
    tr.innerHTML = "<td>" + a.id + "</td><td>" + a.created_at + "</td><td>" + a.request_id +
      "</td><td>" + (a.base_revision ?? "") + "</td><td><span class='pill p-" + a.decision + "'>" + a.decision +
      "</span></td><td>" + (a.reason ?? "") + "</td><td>" + (a.resulting_revision ?? "") + "</td>";
    tb.appendChild(tr);
  });
}
refreshAll();
</script>
</body>
</html>
